name: Publish npm package

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare package tools
        run: npm install --global npm@11.19.1 pnpm@10.11.1
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `release/${version}`);
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check package contents
        run: npm pack --dry-run --json
      - name: Pack publication archive
        run: npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/hatena-pack.json"
      - name: Verify packed archive
        id: package
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'hatena-pack.json'), 'utf8'));
          const packed = Array.isArray(result) ? result : Object.values(result);
          if (packed.length !== 1 || packed[0].name !== name || packed[0].version !== version) throw new Error('Unexpected packed package');
          const file = join(process.env.RUNNER_TEMP, packed[0].filename);
          const integrity = `sha512-${createHash('sha512').update(readFileSync(file)).digest('base64')}`;
          if (integrity !== packed[0].integrity) throw new Error('Packed archive integrity mismatch');
          appendFileSync(process.env.GITHUB_OUTPUT, `file=${file}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `integrity=${integrity}\n`);
          JS
      - name: Check published version
        id: registry
        env:
          PACKAGE_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (!response.ok && response.status !== 404) throw new Error(`Registry returned ${response.status}`);
          if (response.ok && (await response.json()).dist?.integrity !== process.env.PACKAGE_INTEGRITY) throw new Error('Published version has different archive integrity');
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          JS
      - name: Publish with OIDC
        if: steps.registry.outputs.published != 'true'
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: npm publish "$PACKAGE_FILE" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/
