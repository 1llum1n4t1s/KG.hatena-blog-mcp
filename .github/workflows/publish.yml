name: Publish npm package

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Prepare package tools
        run: npm install --global npm@11.19.1 pnpm@10.11.1
      - name: Verify release tag, ancestry and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo "::error::タグ以外では公開しない: $GITHUB_REF"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::版タグの形ではない: $GITHUB_REF_NAME"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::GITHUB_SHA が不正"; exit 1; }
          # 軽量タグで、いまもこの commit を指すこと
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type+" "+.object.sha')" == "commit $GITHUB_SHA" ]] \
            || { echo "::error::タグが $GITHUB_SHA を指す軽量タグではない"; exit 1; }
          # 既定ブランチの祖先であること（compare API）
          default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          cmp="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default?per_page=1" --jq '.status+" "+(.behind_by|tostring)')"
          [[ "$cmp" == "ahead 0" || "$cmp" == "identical 0" ]] || { echo "::error::$default の祖先ではない ($cmp)"; exit 1; }
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`);
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check package contents
        run: npm pack --dry-run --json
      - name: Pack publication archive
        run: npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/hatena-pack.json"
      - name: Verify packed archive
        id: package
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'hatena-pack.json'), 'utf8'));
          const packed = Array.isArray(result) ? result : Object.values(result);
          if (packed.length !== 1 || packed[0].name !== name || packed[0].version !== version) throw new Error('Unexpected packed package');
          const file = join(process.env.RUNNER_TEMP, packed[0].filename);
          const integrity = `sha512-${createHash('sha512').update(readFileSync(file)).digest('base64')}`;
          if (integrity !== packed[0].integrity) throw new Error('Packed archive integrity mismatch');
          appendFileSync(process.env.GITHUB_OUTPUT, `file=${file}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `integrity=${integrity}\n`);
          JS
      - name: Check published version
        id: registry
        env:
          PACKAGE_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`);
          if (!response.ok && response.status !== 404) throw new Error(`Registry returned ${response.status}`);
          if (response.ok && (await response.json()).dist?.integrity !== process.env.PACKAGE_INTEGRITY) throw new Error('Published version has different archive integrity');
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          JS
      - name: Publish with OIDC
        if: steps.registry.outputs.published != 'true'
        env:
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: npm publish "$PACKAGE_FILE" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org/
